name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    strategy:
      # The engine ships Haxe 4.2.5 and 4.3.7; "latest" guards against future
      # regressions. Keep this list in sync with docs/COMPAT.md.
      matrix:
        haxe-version: ["4.2.5", 4.3.7, latest]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: krdlab/setup-haxe@v2
      with:
        haxe-version: ${{ matrix.haxe-version }}
    - name: Register local library
      run: haxelib dev hscript-seiun .
    - name: Run interpreter test-suite
      run: |
        haxe -cp . -cp test -D hscriptPos -D CUSTOM_CLASSES \
          --macro 'hscript.macros.UsingHandler.init()' \
          --macro 'hscript.macros.ClassExtendMacro.init()' \
          -main TestMain --interp
    - name: Run Bytes/Async compatibility suite
      run: |
        haxe -cp . -cp test -D hscriptPos -D CUSTOM_CLASSES \
          --macro 'hscript.macros.UsingHandler.init()' \
          --macro 'hscript.macros.ClassExtendMacro.init()' \
          -main TestBytesCompat --interp
